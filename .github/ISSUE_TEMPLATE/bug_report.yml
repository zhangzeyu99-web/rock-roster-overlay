name: Bug 报告
description: 报告可重复的功能、显示或兼容问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先确认问题可在最新版本复现，并删除日志中的个人信息。
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 v3.5.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 与 OBS 版本
      placeholder: 例如 Windows 11 24H2 / OBS 31.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 问题位置
      options:
        - 阵容编辑
        - 直播间装修
        - OBS 浏览器来源
        - 快捷控制
        - PNG 导出
        - 安装或启动
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 按顺序写出操作和使用的预设、分辨率。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或日志
      description: 可直接拖入图片；日志请先脱敏。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 已在最新版本复现
          required: true
        - label: 未包含账号、令牌、聊天记录或私人文件
          required: true
